name: Gerar APK RDO Petra

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite criar o APK manualmente com um clique

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar o código
      uses: actions/checkout@v4

    - name: 2. Configurar o Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Dar permissão de execução ao Gradle
      run: chmod +x ./gradlew

    - name: 4. Compilar o ficheiro APK
      run: ./gradlew assembleDebug

    - name: 5. Guardar o APK para download
      uses: actions/upload-artifact@v4
      with:
        name: RDO-Petra-App
        path: app/build/outputs/apk/debug/app-debug.apk
